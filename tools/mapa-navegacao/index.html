<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Mapa de Navegação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b16;
    --panel: #0b1122;
    --panel-2: #10182e;
    --brass: #c9a35a;
    --brass-hi: #ecd08e;
    --brass-lo: #6e5525;
    --line: rgba(201, 163, 90, 0.32);
    --text: #e9e3d2;
    --muted: #9a9cab;
    --energy: #6fe3f5;
    --energy-soft: rgba(111, 227, 245, 0.16);
    --danger: #e0756b;
    --radius: 12px;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --display: "Cinzel", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  input { -webkit-user-select: text; user-select: text; }
  .app {
    display: grid;
    grid-template-columns: 1fr 400px;
    height: 100vh;
    height: 100dvh;
  }
  .stage { position: relative; min-width: 0; min-height: 0; }
  #map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #map:active { cursor: grabbing; }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; top: 12px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .title { font-family: var(--display); font-weight: 700; letter-spacing: 0.08em; font-size: 18px; color: var(--brass-hi); margin: 0; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 4px; font-size: 13px; color: var(--muted); }
  .status strong { color: var(--text); font-weight: 600; }
  .hud-buttons { display: flex; gap: 8px; }
  .route {
    position: absolute; bottom: 14px; left: 16px; right: 240px;
    color: var(--muted); font-size: 12px; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- Jump control ---------- */
  .jump-dock { position: absolute; right: 20px; bottom: 20px; }
  .jump-btn {
    position: relative; width: 168px; height: 168px; border-radius: 50%;
    border: 3px solid var(--brass);
    background: radial-gradient(circle at 50% 40%, #2a2210 0%, #120f08 70%);
    box-shadow: 0 0 0 6px rgba(201,163,90,0.12), 0 0 0 7px var(--brass-lo), inset 0 0 24px rgba(0,0,0,0.8);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--brass-hi); padding: 0; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.3s ease, opacity 0.3s ease;
  }
  .jump-btn .jl { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.14em; }
  .jump-btn .jd { font-size: 13px; color: var(--text); max-width: 130px; text-align: center; line-height: 1.2; }
  .jump-btn:disabled { opacity: 0.45; cursor: default; }
  .jump-btn:disabled .jd { color: var(--muted); }
  .jump-btn:not(:disabled) {
    animation: charge 2.4s ease-in-out infinite;
    border-color: var(--brass-hi);
  }
  .jump-btn:not(:disabled):active { transform: scale(0.96); }
  @keyframes charge {
    0%, 100% { box-shadow: 0 0 0 6px rgba(201,163,90,0.15), 0 0 0 7px var(--brass-lo), 0 0 18px rgba(111,227,245,0.25), inset 0 0 24px rgba(0,0,0,0.8); }
    50% { box-shadow: 0 0 0 6px rgba(201,163,90,0.25), 0 0 0 7px var(--brass), 0 0 40px rgba(111,227,245,0.55), inset 0 0 30px rgba(111,227,245,0.15); }
  }

  /* ---------- Travel banner ---------- */
  .travel-banner {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    width: min(420px, calc(100% - 32px));
    padding: 12px 18px; border-radius: var(--radius);
    background: rgba(8, 12, 26, 0.82); border: 1px solid var(--brass);
    text-align: center; pointer-events: none;
    box-shadow: 0 0 30px rgba(111,227,245,0.15);
  }
  .travel-banner[hidden] { display: none; }
  .tb-title { font-family: var(--display); letter-spacing: 0.3em; color: var(--energy); font-size: 14px; animation: blink 1.6s ease-in-out infinite; }
  .tb-route { font-size: 17px; font-weight: 600; margin: 4px 0 10px; }
  .tb-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .tb-bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--brass), var(--energy)); box-shadow: 0 0 10px var(--energy); }
  @keyframes blink { 50% { opacity: 0.45; } }

  /* ---------- Panel ---------- */
  .panel {
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201,163,90,0.08), transparent 60%),
      linear-gradient(180deg, var(--panel-2), var(--panel));
    border-left: 2px solid var(--brass-lo);
    box-shadow: inset 1px 0 0 rgba(236,208,142,0.15);
    display: flex; flex-direction: column; min-height: 0;
    transition: opacity 0.4s ease;
  }
  .panel.locked { opacity: 0.35; pointer-events: none; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 16px 0; }
  .tabs button {
    font-family: var(--display); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    min-height: 46px; border-radius: 10px 10px 0 0; border-bottom: none;
    background: rgba(255,255,255,0.03); color: var(--muted);
  }
  .tabs button.active { color: var(--brass-hi); background: rgba(201,163,90,0.12); border-color: var(--brass); }
  .tab { flex: 1; overflow-y: auto; padding: 16px; border-top: 1px solid var(--brass); display: flex; flex-direction: column; gap: 18px; }
  .tab[hidden] { display: none; }
  h2 {
    font-family: var(--display); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--brass); margin: 0 0 10px; font-weight: 500;
    display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  button {
    font: inherit; color: var(--text); background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; min-height: 44px; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.09); }
  button.primary {
    background: linear-gradient(180deg, var(--brass-hi), var(--brass) 55%, #a8843f);
    color: #1d1505; border-color: var(--brass-hi); font-weight: 700; letter-spacing: 0.04em;
    box-shadow: 0 2px 0 var(--brass-lo), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  button.primary:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--brass-lo); }
  button.danger { color: var(--danger); border-color: rgba(224,117,107,0.4); }
  button.icon { width: 44px; padding: 0; font-weight: 700; background: rgba(8,12,26,0.7); }
  button:disabled { opacity: 0.4; cursor: default; }

  /* Universe tiles */
  .tiles { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .tile {
    width: 100%; text-align: left; display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 4px 12px;
    min-height: 64px; padding: 10px 14px; background: rgba(255,255,255,0.025);
  }
  .tile.selected { border-color: var(--brass-hi); background: rgba(201,163,90,0.13); box-shadow: inset 0 0 0 1px rgba(236,208,142,0.3); }
  .tile .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
  .tile .nm { font-weight: 600; font-size: 16px; }
  .tile .sub { grid-column: 2 / 4; font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .badges { display: flex; gap: 6px; }
  .badge { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; border: 1px solid; }
  .badge.ship { color: var(--energy); border-color: rgba(111,227,245,0.5); }
  .badge.base { color: var(--brass-hi); border-color: var(--line); }

  .card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: rgba(0,0,0,0.2); position: relative; }
  .card .name { font-size: 20px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .card h3 { font-size: 11px; color: var(--muted); font-weight: 500; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.1em; }
  .coords { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 16px; }
  .coords dt { color: var(--brass); font-family: Georgia, "Times New Roman", serif; font-style: italic; }
  .coords dd { margin: 0; font-family: var(--mono); }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .row button { flex: 1 1 auto; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }

  .obs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .obs li { display: flex; align-items: stretch; gap: 6px; }
  .obs .edit { flex: 1; text-align: left; font-size: 13px; padding: 8px 10px; min-height: 44px; background: rgba(255,255,255,0.03); }
  .obs .edit .from { display: block; color: var(--muted); font-size: 12px; }
  .obs .edit .val { font-family: var(--mono); }
  .obs .del { width: 44px; padding: 0; color: var(--muted); }

  .data-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .data-actions button { flex: 1; font-size: 13px; }

  /* ---------- Register tab ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 44px; padding: 8px 14px; border-radius: 99px; display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.04); font-weight: 600;
  }
  .chip.active { border-color: var(--brass-hi); background: rgba(201,163,90,0.2); color: var(--brass-hi); box-shadow: 0 0 12px rgba(201,163,90,0.25); }
  .chip.add { border-style: dashed; color: var(--muted); }
  .chip:disabled { opacity: 0.3; }
  .new-name {
    margin-top: 10px; width: 100%; font: inherit; font-size: 16px; color: var(--text);
    background: rgba(0,0,0,0.3); border: 1px solid var(--brass); border-radius: 10px; padding: 10px 12px; min-height: 46px;
  }
  .new-name[hidden] { display: none; }
  .new-name:focus { outline: 2px solid var(--energy); outline-offset: 1px; }

  .instrument {
    position: relative; border-radius: 16px; padding: 14px;
    background: radial-gradient(ellipse at 50% 30%, rgba(111,227,245,0.05), transparent 70%), rgba(0,0,0,0.28);
    border: 1px solid var(--brass-lo);
    box-shadow: inset 0 0 0 1px rgba(236,208,142,0.12), inset 0 0 30px rgba(0,0,0,0.5);
  }
  .instrument::before, .instrument::after {
    content: ""; position: absolute; top: 9px; width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--brass-hi), var(--brass-lo));
  }
  .instrument::before { left: 9px; } .instrument::after { right: 9px; }
  .inst-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; padding: 0 10px; }
  .inst-sym { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 28px; color: var(--brass-hi); line-height: 1; }
  .inst-val { font-family: var(--mono); font-size: 20px; color: var(--energy); text-shadow: 0 0 10px rgba(111,227,245,0.5); }
  .instrument.off .inst-val { color: var(--muted); text-shadow: none; }
  .toggle {
    min-height: 36px; padding: 4px 12px; border-radius: 99px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .toggle.on { color: var(--energy); border-color: rgba(111,227,245,0.6); background: var(--energy-soft); }
  .dial { display: block; width: 100%; max-width: 320px; aspect-ratio: 1; margin: 0 auto; touch-action: none; }
  .nudge { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; margin-top: 10px; align-items: center; }
  .nudge .step { font-size: 22px; padding: 0; min-height: 52px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; min-height: 50px; font-size: 26px; font-family: Georgia, "Times New Roman", serif; background: transparent; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active { background: var(--energy-soft); color: var(--energy); }
  .instrument.off .dial, .instrument.off .nudge, .instrument.off .rbar, .instrument.off .rsteps { opacity: 0.35; }

  .rbar { position: relative; height: 70px; margin: 6px 6px 0; touch-action: none; cursor: pointer; }
  .rtrack {
    position: absolute; left: 0; right: 0; top: 20px; height: 22px; border-radius: 11px;
    background: linear-gradient(180deg, #05070f, #111a30); border: 1px solid var(--brass-lo);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.8); overflow: hidden;
  }
  .rfill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: linear-gradient(90deg, rgba(111,227,245,0.15), rgba(111,227,245,0.85));
    box-shadow: 0 0 14px rgba(111,227,245,0.7);
  }
  .rfill::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,0.25) 6px 8px);
  }
  .rthumb {
    position: absolute; top: 10px; width: 26px; height: 42px; margin-left: -13px; border-radius: 6px;
    background: linear-gradient(90deg, var(--brass-lo), var(--brass-hi) 45%, var(--brass) 60%, var(--brass-lo));
    border: 1px solid #2a1f0a; box-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .rthumb::after { content: ""; position: absolute; left: 50%; top: 8px; bottom: 8px; width: 2px; margin-left: -1px; background: rgba(0,0,0,0.4); }
  .rticks { position: absolute; left: 0; right: 0; top: 48px; height: 20px; font-size: 10px; color: var(--muted); font-family: var(--mono); }
  .rticks span { position: absolute; transform: translateX(-50%); }
  .rticks span::before { content: ""; position: absolute; left: 50%; top: -5px; width: 1px; height: 4px; background: var(--line); }
  .rsteps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .rsteps button { font-family: var(--mono); min-height: 50px; }

  .error { color: var(--danger); font-size: 14px; min-height: 1.2em; margin: 0; }
  .save-btn { min-height: 56px; font-size: 17px; font-family: var(--display); letter-spacing: 0.1em; }
  .toast {
    position: absolute; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    padding: 10px 18px; border-radius: 99px; background: rgba(8,12,26,0.92); border: 1px solid var(--energy);
    color: var(--energy); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 50%) minmax(0, 50%); }
    .panel { border-left: 0; border-top: 2px solid var(--brass-lo); }
    .jump-btn { width: 120px; height: 120px; }
    .jump-btn .jl { font-size: 17px; }
    .jump-btn .jd { font-size: 12px; max-width: 96px; }
    .route { right: 150px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="map" aria-label="Mapa esférico dos universos"></canvas>
    <div class="hud">
      <div>
        <h1 class="title">Mapa de Navegação</h1>
        <div class="status">
          <span>Nave em <strong id="shipName"></strong></span>
          <span>Base <strong id="baseName"></strong></span>
        </div>
      </div>
      <div class="hud-buttons">
        <button class="icon" id="btnSound" title="Som"></button>
        <button class="icon" id="btnRecenter" title="Recentralizar a vista">⌖</button>
      </div>
    </div>
    <div class="travel-banner" id="travelBanner" hidden>
      <div class="tb-title">VIAJANDO</div>
      <div class="tb-route" id="travelRoute"></div>
      <div class="tb-bar"><div id="travelBar"></div></div>
    </div>
    <div class="jump-dock" id="jumpDock">
      <button class="jump-btn" id="btnJump" disabled>
        <span class="jl">SALTAR</span>
        <span class="jd" id="jumpDest"></span>
      </button>
    </div>
    <div class="route" id="route"></div>
  </div>

  <aside class="panel" id="panel">
    <nav class="tabs">
      <button data-tab="universos" class="active">Universos</button>
      <button data-tab="registro">Registrar</button>
    </nav>

    <section class="tab" id="tab-universos">
      <div>
        <h2>Universos conhecidos</h2>
        <ul class="tiles" id="tiles"></ul>
      </div>
      <div id="selection"></div>
      <div>
        <h2>Dados</h2>
        <div class="data-actions">
          <button id="btnExport">Exportar</button>
          <button id="btnImport">Importar</button>
          <button id="btnReset" class="danger">Apagar tudo</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </section>

    <section class="tab" id="tab-registro" hidden>
      <div>
        <h2>Universo</h2>
        <div class="chips" id="chipsTarget"></div>
        <input class="new-name" id="newName" maxlength="40" placeholder="Nome do novo universo" hidden>
      </div>
      <div>
        <h2>Medido a partir de</h2>
        <div class="chips" id="chipsFrom"></div>
      </div>

      <div class="instrument" id="instTh">
        <div class="inst-head"><span class="inst-sym">θ</span><span class="inst-val" id="valTh"></span></div>
        <canvas class="dial" id="dialTh"></canvas>
        <div class="nudge">
          <button class="step" data-dial="th" data-dir="-1">−</button>
          <div class="seg" data-dial="th"><button data-ring="0">°</button><button data-ring="1">′</button><button data-ring="2">″</button></div>
          <button class="step" data-dial="th" data-dir="1">+</button>
        </div>
      </div>

      <div class="instrument" id="instPh">
        <div class="inst-head"><span class="inst-sym">φ</span><span class="inst-val" id="valPh"></span><button class="toggle" id="togPh"></button></div>
        <canvas class="dial" id="dialPh"></canvas>
        <div class="nudge">
          <button class="step" data-dial="ph" data-dir="-1">−</button>
          <div class="seg" data-dial="ph"><button data-ring="0">°</button><button data-ring="1">′</button><button data-ring="2">″</button></div>
          <button class="step" data-dial="ph" data-dir="1">+</button>
        </div>
      </div>

      <div class="instrument" id="instR">
        <div class="inst-head"><span class="inst-sym">r</span><span class="inst-val" id="valR"></span><button class="toggle" id="togR"></button></div>
        <div class="rbar" id="rbar">
          <div class="rtrack"><div class="rfill" id="rfill"></div></div>
          <div class="rthumb" id="rthumb"></div>
          <div class="rticks" id="rticks"></div>
        </div>
        <div class="rsteps">
          <button data-r="-1">−1</button><button data-r="-0.1">−0,1</button><button data-r="0.1">+0,1</button><button data-r="1">+1</button>
        </div>
      </div>

      <p class="error" id="fError"></p>
      <button class="primary save-btn" id="btnSave">Registrar</button>
    </section>
    <div class="toast" id="toast"></div>
  </aside>
</div>

<script>
(() => {
  'use strict';

  // ---------- Math ----------
  const DEG = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z });
  const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y, z: a.z + b.z });
  const mul = (a, k) => ({ x: a.x * k, y: a.y * k, z: a.z * k });
  const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const len = a => Math.hypot(a.x, a.y, a.z);
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerpV = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z, b.z, t) });
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const ORIGIN = { x: 0, y: 0, z: 0 };

  // θ: polar angle from +z axis (0..180). φ: azimuth in xy-plane from +x axis (0..360).
  function sphToCart(r, th, ph) {
    const t = th * DEG, p = ph * DEG;
    return { x: r * Math.sin(t) * Math.cos(p), y: r * Math.sin(t) * Math.sin(p), z: r * Math.cos(t) };
  }
  function cartToSph(v) {
    const r = len(v);
    if (r < 1e-9) return { r: 0, th: null, ph: null };
    const th = Math.acos(clamp(v.z / r, -1, 1)) / DEG;
    let ph = null;
    if (Math.hypot(v.x, v.y) > 1e-9) {
      ph = Math.atan2(v.y, v.x) / DEG;
      if (ph < 0) ph += 360;
    }
    return { r, th, ph };
  }

  // Closest approach between rays p1 + t·u and p2 + q·v (unit vectors).
  // Returns the midpoint when both rays point forward and pass close enough to meet.
  function crossRays(p1, u, p2, v) {
    const w = sub(p1, p2), b = dot(u, v), d = dot(u, w), e = dot(v, w);
    const den = 1 - b * b;
    if (den < 1e-6) return null;
    const t = (b * e - d) / den, q = (e - b * d) / den;
    if (t <= 0 || q <= 0) return null;
    const a = add(p1, mul(u, t)), c = add(p2, mul(v, q));
    if (len(sub(a, c)) > 0.01 * (t + q) / 2) return null;
    return mul(add(a, c), 0.5);
  }

  // ---------- Formatting ----------
  function dms(d) {
    const total = Math.round(d * 3600);
    return { D: Math.floor(total / 3600), M: Math.floor((total % 3600) / 60), S: total % 60 };
  }
  function fmtAngle(d, wrap) {
    if (d == null) return '—';
    let { D, M, S } = dms(d);
    if (wrap && D >= 360) D -= 360;
    return `${D}°${String(M).padStart(2, '0')}′${String(S).padStart(2, '0')}″`;
  }
  const fmtR = r => r.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const fmtR1 = r => r.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  function niceStep(x) {
    if (x <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(x)));
    const n = x / p;
    return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p;
  }
  const PALETTE = ['#e79bd8', '#9be38f', '#f0a46b', '#a8a4ff', '#f2e27a', '#ff8f8f', '#7fe0c8', '#8fc8ff'];

  // ---------- State ----------
  // universes: [{ id, name }] ('alther' is the fixed origin).
  // obs: coordinates of `target` measured from `from` (θ always; φ and r optional). One per ordered pair.
  // current: where the ship is. base: the universe the map is centered on for analysis.
  const KEY = 'alther-mapa-navegacao-v2';
  const defaultState = () => ({
    universes: [{ id: 'alther', name: 'Alther' }],
    obs: [], current: 'alther', base: 'alther', history: []
  });
  const optNum = v => v === null || Number.isFinite(v);
  function validState(s) {
    if (!s || !Array.isArray(s.universes) || !Array.isArray(s.obs) || !Array.isArray(s.history)) return false;
    const ids = new Set(s.universes.map(u => u && u.id));
    return s.universes.every(u => typeof u.id === 'string' && typeof u.name === 'string') &&
      ids.has('alther') && ids.has(s.current) &&
      s.obs.every(o => o && typeof o.id === 'string' && ids.has(o.target) && ids.has(o.from) &&
        Number.isFinite(o.th) && optNum(o.ph) && optNum(o.r));
  }
  function normalize(s) {
    if (!s.base || !s.universes.some(u => u.id === s.base)) s.base = s.current;
    // Older saves could hold several records for the same ordered pair: keep the latest one.
    const seen = new Set();
    s.obs = s.obs.slice().reverse().filter(o => {
      const k = o.target + '|' + o.from;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    }).reverse();
    return s;
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (validState(s)) return normalize(s);
    } catch (e) { /* storage unavailable */ }
    return defaultState();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  let state = load();
  let selectedId = null;
  const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const byId = id => state.universes.find(u => u.id === id);
  const colorOf = id => id === 'alther' ? '#f5efe0' : PALETTE[Math.max(0, state.universes.findIndex(u => u.id === id) - 1) % PALETTE.length];
  const findObs = (target, from) => state.obs.find(o => o.target === target && o.from === from);

  // ---------- Solving positions ----------
  let solved = { pos: new Map(), noCross: new Set() };
  function solve() {
    const pos = new Map([['alther', ORIGIN]]);
    let changed = true;
    while (changed) {
      changed = false;
      for (const o of state.obs) {
        if (o.ph == null || o.r == null) continue;
        const v = sphToCart(o.r, o.th, o.ph);
        if (pos.has(o.from) && !pos.has(o.target)) { pos.set(o.target, add(pos.get(o.from), v)); changed = true; }
        else if (pos.has(o.target) && !pos.has(o.from)) { pos.set(o.from, sub(pos.get(o.target), v)); changed = true; }
      }
      for (const u of state.universes) {
        if (pos.has(u.id)) continue;
        const rays = state.obs.filter(o => o.target === u.id && o.ph != null && o.r == null && pos.has(o.from));
        let p = null;
        for (let i = 0; i < rays.length && !p; i++) {
          for (let j = i + 1; j < rays.length && !p; j++) {
            if (rays[i].from === rays[j].from) continue;
            p = crossRays(pos.get(rays[i].from), sphToCart(1, rays[i].th, rays[i].ph),
                          pos.get(rays[j].from), sphToCart(1, rays[j].th, rays[j].ph));
          }
        }
        if (p) { pos.set(u.id, p); changed = true; }
      }
    }
    const noCross = new Set();
    for (const u of state.universes) {
      if (pos.has(u.id)) continue;
      const origins = new Set(state.obs.filter(o => o.target === u.id && o.ph != null && o.r == null && pos.has(o.from)).map(o => o.from));
      if (origins.size >= 2) noCross.add(u.id);
    }
    solved = { pos, noCross };
  }
  const posOf = id => solved.pos.get(id);
  const located = id => solved.pos.has(id);
  const basePos = () => posOf(state.base);

  // ---------- Camera ----------
  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  const view = { yaw: -0.6, pitch: 0.42, zoom: 1, center: { ...ORIGIN }, R: 4 };
  let anim = null;

  function targetRadius(ref) {
    let max = 0;
    for (const p of solved.pos.values()) max = Math.max(max, len(sub(p, ref)));
    if (max === 0) return { R: 4, step: 1 };
    const step = niceStep(max / 3);
    return { R: step * Math.ceil((max * 1.08) / step), step };
  }
  function project(p) {
    const q = sub(p, view.center);
    const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw);
    const x1 = q.x * cy - q.y * sy;
    const y1 = q.x * sy + q.y * cy;
    const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
    const y2 = y1 * cp - q.z * sp;
    const z2 = y1 * sp + q.z * cp;
    const cam = view.R * 4.5;
    const s = cam / Math.max(cam + y2, cam * 0.15);
    const scale = (Math.min(W, H) * 0.36 / view.R) * view.zoom;
    return { sx: W / 2 + x1 * scale * s, sy: H / 2 + 14 - z2 * scale * s, depth: y2 / view.R, s };
  }
  function resize() {
    const r = canvas.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    requestDraw();
  }

  // ---------- Map drawing ----------
  const stars = (() => {
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    return Array.from({ length: 220 }, () => ({ x: rnd(), y: rnd(), r: rnd() * 1.2 + 0.2, a: rnd() * 0.6 + 0.15 }));
  })();
  const alphaFor = depth => clamp(0.55 - depth * 0.4, 0.08, 0.9);

  function polyline(points, color, width, baseAlpha = 1, dash = null) {
    ctx.lineWidth = width;
    ctx.setLineDash(dash || []);
    ctx.strokeStyle = color;
    const pr = points.map(project);
    for (let i = 0; i < pr.length - 1; i++) {
      const a = pr[i], b = pr[i + 1];
      ctx.globalAlpha = clamp(alphaFor((a.depth + b.depth) / 2) * baseAlpha, 0, 1);
      ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
  }
  function circle(fn, n = 96) {
    const pts = [];
    for (let i = 0; i <= n; i++) pts.push(fn((i / n) * Math.PI * 2));
    return pts;
  }
  function text(str, p, opts = {}) {
    const pr = project(p);
    ctx.font = opts.font || '12px system-ui, sans-serif';
    ctx.fillStyle = opts.color || '#9a9cab';
    ctx.globalAlpha = opts.alpha != null ? opts.alpha : clamp(alphaFor(pr.depth) + 0.2, 0.2, 1);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, pr.sx + (opts.dx || 0), pr.sy + (opts.dy || 0));
    ctx.globalAlpha = 1;
  }

  let hitTargets = [];

  function drawGrid() {
    const c = view.center, R = view.R;
    const { step } = targetRadius(basePos());
    const at = v => add(c, v);
    const GRID = '#6fd3e8', GOLD = '#d4af5f';
    for (let th = 30; th <= 150; th += 30) {
      const t = th * DEG;
      polyline(circle(a => at({ x: R * Math.sin(t) * Math.cos(a), y: R * Math.sin(t) * Math.sin(a), z: R * Math.cos(t) })),
        GRID, th === 90 ? 1.4 : 0.8, th === 90 ? 0.9 : 0.45);
    }
    for (let ph = 0; ph < 360; ph += 30) {
      const p = ph * DEG, pts = [];
      for (let i = 0; i <= 48; i++) {
        const t = (i / 48) * Math.PI;
        pts.push(at({ x: R * Math.sin(t) * Math.cos(p), y: R * Math.sin(t) * Math.sin(p), z: R * Math.cos(t) }));
      }
      polyline(pts, GRID, ph === 0 ? 1.4 : 0.8, ph === 0 ? 0.9 : 0.4);
    }
    for (let k = step; k < R - 1e-9; k += step) {
      polyline(circle(a => at({ x: k * Math.cos(a), y: k * Math.sin(a), z: 0 })), GRID, 0.6, 0.35, [3, 5]);
      text(fmtR(k), at({ x: k * Math.cos(-0.3), y: k * Math.sin(-0.3), z: 0 }), { font: '10px system-ui', color: GRID });
    }
    text(fmtR(R), at({ x: R * Math.cos(-0.3), y: R * Math.sin(-0.3), z: 0 }), { font: '10px system-ui', color: GRID });
    polyline([at({ x: 0, y: 0, z: -R }), at({ x: 0, y: 0, z: R * 1.12 })], GOLD, 1.2, 0.9);
    polyline([at(ORIGIN), at({ x: R * 1.12, y: 0, z: 0 })], GOLD, 1, 0.7, [6, 4]);
    text('0°', at({ x: 0, y: 0, z: R * 1.2 }), { color: GOLD, font: '600 13px system-ui' });
    text('180°', at({ x: 0, y: 0, z: -R * 1.1 }), { color: GOLD, font: '12px system-ui' });
    for (let ph = 0; ph < 360; ph += 30) {
      const p = ph * DEG;
      text(`${ph}°`, at({ x: R * 1.1 * Math.cos(p), y: R * 1.1 * Math.sin(p), z: 0 }),
        { color: ph === 0 ? GOLD : '#9ab8c4', font: ph === 0 ? '600 13px system-ui' : '11px system-ui' });
    }
  }

  // Partial observations: θ only → ring (cone around the vertical through the origin);
  // θ + φ → ray from the origin. They stay on the map after the universe is located.
  function drawPartials(now) {
    const R = view.R;
    const labels = [];
    for (const o of state.obs) {
      if (o.r != null || !located(o.from)) continue;
      const targetKnown = located(o.target);
      const glowing = o.target === selectedId || effectT(o.target, now) != null;
      const color = colorOf(o.target);
      const origin = posOf(o.from);
      const w = glowing ? 2.4 : targetKnown ? 1.1 : 1.6;
      const alpha = glowing ? 1.6 : targetKnown ? 0.55 : 1.2;
      if (o.ph == null) {
        const D = targetKnown ? len(sub(posOf(o.target), origin)) : R;
        const t = o.th * DEG;
        const pts = circle(a => add(origin, { x: D * Math.sin(t) * Math.cos(a), y: D * Math.sin(t) * Math.sin(a), z: D * Math.cos(t) }));
        polyline(pts, color, w, alpha);
        if (!targetKnown) {
          let best = null;
          for (const p of pts) { const pr = project(p); if (!best || pr.depth < best.pr.depth) best = { p, pr }; }
          labels.push({ name: byId(o.target).name, p: best.p, color });
        }
      } else {
        const dir = sphToCart(1, o.th, o.ph);
        const reach = targetKnown ? len(sub(posOf(o.target), origin)) * 1.15
                                  : Math.max(R * 2.2, len(sub(origin, view.center)) + R * 1.5);
        const pts = [];
        for (let i = 0; i <= 40; i++) pts.push(add(origin, mul(dir, reach * i / 40)));
        polyline(pts, color, w, alpha, [10, 6]);
        if (!targetKnown) labels.push({ name: byId(o.target).name, p: add(origin, mul(dir, Math.min(reach, R * 1.05))), color });
      }
    }
    for (const l of labels) text(l.name, l.p, { color: l.color, font: '600 12px system-ui', dy: -10, alpha: 0.95 });
  }

  // ---------- Effects (discovery / arrival) ----------
  const EFFECT_MS = 2600;
  let effects = []; // { id, t0, kind: 'found' | 'arrive' }
  function effectT(id, now, kind) {
    const d = effects.find(x => x.id === id && (!kind || x.kind === kind));
    if (!d) return null;
    const t = (now - d.t0) / EFFECT_MS;
    return t >= 0 && t < 1 ? t : null;
  }
  function drawBurst(x, y, color, t) {
    const fr = 70 * (0.4 + t);
    const flash = ctx.createRadialGradient(x, y, 0, x, y, fr);
    flash.addColorStop(0, '#ffffff'); flash.addColorStop(0.25, color); flash.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = Math.pow(1 - t, 2) * 0.9;
    ctx.fillStyle = flash;
    ctx.beginPath(); ctx.arc(x, y, fr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color;
    for (let k = 0; k < 3; k++) {
      const tk = t * 1.5 - k * 0.2;
      if (tk <= 0 || tk >= 1) continue;
      ctx.globalAlpha = (1 - tk) * 0.85;
      ctx.lineWidth = 2.5 * (1 - tk) + 0.5;
      ctx.beginPath(); ctx.arc(x, y, 8 + easeOut(tk) * 130, 0, Math.PI * 2); ctx.stroke();
    }
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2 + (i % 2) * 0.17;
      const dist = easeOut(t) * (60 + (i % 3) * 25);
      ctx.globalAlpha = (1 - t) * 0.9;
      ctx.fillStyle = i % 3 === 0 ? '#ffffff' : color;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * dist, y + Math.sin(a) * dist, 2 * (1 - t) + 0.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Small magical vessel, pointing along +x before rotation.
  function drawShip(x, y, angle, s, now) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 2.4);
    glow.addColorStop(0, 'rgba(111,227,245,0.45)'); glow.addColorStop(1, 'rgba(111,227,245,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, s * 2.4, 0, Math.PI * 2); ctx.fill();
    // engine flame
    const flick = 0.75 + 0.25 * Math.sin(now / 60);
    const fl = ctx.createRadialGradient(-s * 0.8, 0, 0, -s * 0.8, 0, s * 0.9 * flick);
    fl.addColorStop(0, '#ffffff'); fl.addColorStop(0.4, '#6fe3f5'); fl.addColorStop(1, 'rgba(111,227,245,0)');
    ctx.fillStyle = fl;
    ctx.beginPath(); ctx.ellipse(-s * 1.05, 0, s * 0.8 * flick, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    // sails / wings
    ctx.fillStyle = 'rgba(111,227,245,0.55)';
    ctx.strokeStyle = 'rgba(200,250,255,0.9)'; ctx.lineWidth = 1;
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * 0.15, sg * s * 0.25);
      ctx.quadraticCurveTo(-s * 0.2, sg * s * 1.2, -s * 0.75, sg * s * 1.0);
      ctx.lineTo(-s * 0.45, sg * s * 0.25);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // hull
    const hull = ctx.createLinearGradient(0, -s * 0.4, 0, s * 0.4);
    hull.addColorStop(0, '#f6e3ad'); hull.addColorStop(0.5, '#c9a35a'); hull.addColorStop(1, '#6e5525');
    ctx.fillStyle = hull; ctx.strokeStyle = '#2a1f0a'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(s * 1.1, 0);
    ctx.quadraticCurveTo(s * 0.3, s * 0.5, -s * 0.85, s * 0.32);
    ctx.lineTo(-s * 0.65, 0);
    ctx.lineTo(-s * 0.85, -s * 0.32);
    ctx.quadraticCurveTo(s * 0.3, -s * 0.5, s * 1.1, 0);
    ctx.fill(); ctx.stroke();

    ctx.beginPath(); ctx.arc(s * 0.25, 0, s * 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawUniverses(now) {
    const items = [...solved.pos.entries()].map(([id, p]) => ({ id, pr: project(p) }))
      .sort((a, b) => b.pr.depth - a.pr.depth);
    hitTargets = [];
    for (const { id, pr } of items) {
      const u = byId(id);
      const isBase = id === state.base, isSel = id === selectedId;
      const color = isBase ? '#d4af5f' : colorOf(id);
      const tf = effectT(id, now, 'found'), ta = effectT(id, now, 'arrive');
      let grow = 1, labelAlpha = 1;
      if (tf != null) {
        drawBurst(pr.sx, pr.sy, color, tf);
        grow = tf < 0.12 ? 0 : easeOutBack(clamp((tf - 0.12) / 0.4, 0, 1));
        labelAlpha = clamp((tf - 0.35) / 0.3, 0, 1);
      }
      if (ta != null) drawBurst(pr.sx, pr.sy, '#6fe3f5', ta);
      const rad = (isBase ? 8 : 6) * clamp(pr.s, 0.6, 1.4) * grow;
      if (rad > 0.1) {
        const glow = ctx.createRadialGradient(pr.sx, pr.sy, 0, pr.sx, pr.sy, rad * 3.5);
        glow.addColorStop(0, color); glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = 0.45; ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(pr.sx, pr.sy, rad * 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(pr.sx, pr.sy, rad, 0, Math.PI * 2); ctx.fill();
      }
      if (isSel && grow >= 1) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(pr.sx, pr.sy, rad + 5, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = labelAlpha;
      ctx.font = `${isBase ? '700 14px' : '600 13px'} system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = isBase ? '#d4af5f' : '#e6e2d6';
      ctx.fillText(u.name, pr.sx, pr.sy - Math.max(rad, 6) - 6);
      ctx.globalAlpha = 1;
      if (id === state.current && !travel) drawShip(pr.sx + 20, pr.sy + 14, -0.35, 9, now);
      hitTargets.push({ id, x: pr.sx, y: pr.sy, depth: pr.depth });
    }
  }

  // ---------- Travel ----------
  const TRAVEL_MS = 9000;
  let travel = null; // { from, to, a, b, t0 }
  const shipProgress = p => ease(clamp((p - 0.1) / 0.82, 0, 1));

  function drawTravel(now) {
    if (!travel) return;
    const p = clamp((now - travel.t0) / TRAVEL_MS, 0, 1);
    const pa = project(travel.a), pb = project(travel.b);
    // route
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(111,227,245,0.18)'; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
    ctx.strokeStyle = '#d4af5f'; ctx.lineWidth = 2;
    ctx.setLineDash([12, 10]); ctx.lineDashOffset = -now / 25;
    ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0; ctx.lineCap = 'butt';
    // destination pulse
    const pulse = (now / 1200) % 1;
    ctx.strokeStyle = '#6fe3f5'; ctx.globalAlpha = 1 - pulse; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pb.sx, pb.sy, 10 + pulse * 30, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    // trail + ship
    const ps = shipProgress(p);
    for (let i = 24; i >= 1; i--) {
      const q = ps - i * 0.006;
      if (q <= 0) continue;
      const tp = project(lerpV(travel.a, travel.b, q));
      const jitter = Math.sin(now / 90 + i * 1.7) * 2.5;
      ctx.globalAlpha = (1 - i / 25) * 0.8;
      ctx.fillStyle = i % 4 === 0 ? '#ffffff' : '#6fe3f5';
      ctx.beginPath(); ctx.arc(tp.sx + jitter, tp.sy - jitter, 3 * (1 - i / 25) + 0.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const sp = project(lerpV(travel.a, travel.b, ps));
    const angle = Math.atan2(pb.sy - pa.sy, pb.sx - pa.sx);
    drawShip(sp.sx, sp.sy, angle, 15 * clamp(sp.s, 0.7, 1.4), now);
    // banner
    $('travelBar').style.width = (p * 100).toFixed(1) + '%';
  }

  function canJump(id) {
    return !travel && id && id !== state.current && located(id);
  }
  function startJump() {
    const to = selectedId;
    if (!canJump(to)) return;

  function draw(now) {

  // ---------- Sound (Web Audio, no files) ----------
  const SOUND_KEY = 'alther-mapa-navegacao-som';
  let muted = false;
  try { muted = localStorage.getItem(SOUND_KEY) === 'off'; } catch (e) { /* ignore */ }
  let actx = null;

    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);

  function playDiscovery() {
    const c = audio(); if (!c) return;
    const out = echoBus(c), t = c.currentTime + 0.05;
    const pad = c.createOscillator(), pg = c.createGain();
    pad.type = 'sine'; pad.frequency.setValueAtTime(110, t); pad.frequency.exponentialRampToValueAtTime(220, t + 1.2);
    pg.gain.setValueAtTime(0.0001, t); pg.gain.exponentialRampToValueAtTime(0.18, t + 0.5); pg.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    pad.connect(pg); pg.connect(out); pad.start(t); pad.stop(t + 2.3);
    [587.33, 739.99, 880, 1046.5, 1174.66, 1479.98].forEach((f, i) => {

  function playJump() {

    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
    const data = buf.getChannelData(0);

    const noise = c.createBufferSource(), bp = c.createBiquadFilter(), ng = c.createGain();
    noise.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 4;

    ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.35, t + 0.6); ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    bg.gain.setValueAtTime(0.0001, t + 0.6); bg.gain.exponentialRampToValueAtTime(0.4, t + 0.7); bg.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    boom.connect(bg); bg.connect(c.destination); boom.start(t + 0.6); boom.stop(t + 1.55);

  let drone = null;
  function startDrone() {
    const c = audio(); if (!c || drone) return;
    const t = c.currentTime;
    const g = c.createGain(), lp = c.createBiquadFilter(), lfo = c.createOscillator(), lg = c.createGain();
    const o1 = c.createOscillator(), o2 = c.createOscillator(), o3 = c.createOscillator();

  function stopDrone() {

    g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);

  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => audio(), { capture: true }));

  // ---------- Map input ----------
  const pointers = new Map();
  let pinch = null, tapStart = null;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);

    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];

  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;

  canvas.addEventListener('pointercancel', endPointer);

    requestDraw();
  }, { passive: false });

  // ---------- Dial instrument (concentric degree / minute / second rings) ----------
  function createDial(cv, opts) {
    const dctx = cv.getContext('2d');
    // ring geometry as fractions of the dial radius
    const RINGS = [
      { band: [0.78, 0.99], gear: opts.degGear, count: opts.degCount, wrap: opts.degWrap, label: opts.degLabel, mid: opts.degMid, font: 0.05 },
      { band: [0.57, 0.765], gear: 6, count: 60, wrap: true, label: 5, mid: 0, font: 0.046 },
      { band: [0.37, 0.555], gear: 6, count: 60, wrap: true, label: 5, mid: 0, font: 0.042 }
    ];
    const d = { parts: [0, 0, 0], active: 0, enabled: true };
    let size = 0, drag = null;

    function fit() {
      const w = cv.clientWidth;
      if (!w) return;
      const dpr = window.devicePixelRatio || 1;
      size = w;
      cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
      dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      render();
    }
    new ResizeObserver(fit).observe(cv);

    function constrain() {
      if (opts.maxTotal != null && d.parts[0] >= opts.maxTotal) { d.parts[0] = opts.maxTotal; d.parts[1] = 0; d.parts[2] = 0; }
    }
    function step(ring, n) {
      const R = RINGS[ring];
      let v = d.parts[ring] + n;
      v = R.wrap ? ((v % R.count) + R.count) % R.count : clamp(v, 0, R.count - 1);
      if (v === d.parts[ring]) return;
      d.parts[ring] = v;
      constrain();
      tick();
      render();
      opts.onChange();
    }

    function render() {
      if (!size) return;
      const c = dctx, S = size, cx = S / 2, cy = S / 2, R = S / 2 - 3;
      c.clearRect(0, 0, S, S);
      c.globalAlpha = 1;
      // body
      const body = c.createRadialGradient(cx, cy * 0.8, R * 0.1, cx, cy, R);
      body.addColorStop(0, '#16203a'); body.addColorStop(1, '#060a16');
      c.fillStyle = body;
      c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();
      // rings
      RINGS.forEach((ring, i) => {
        const r0 = R * ring.band[0], r1 = R * ring.band[1];
        const active = d.enabled && i === d.active;
        c.fillStyle = active ? 'rgba(111,227,245,0.10)' : 'rgba(255,255,255,0.025)';
        c.beginPath(); c.arc(cx, cy, r1, 0, Math.PI * 2); c.arc(cx, cy, r0, 0, Math.PI * 2, true); c.fill();
        c.strokeStyle = active ? 'rgba(111,227,245,0.8)' : 'rgba(201,163,90,0.55)';
        c.lineWidth = active ? 1.6 : 1;
        c.beginPath(); c.arc(cx, cy, r1, 0, Math.PI * 2); c.stroke();
        c.beginPath(); c.arc(cx, cy, r0, 0, Math.PI * 2); c.stroke();
        const v = d.parts[i];
        const tickCol = active ? '#bff6ff' : '#d8bf86';
        c.font = `600 ${Math.round(S * ring.font)}px ui-monospace, Menlo, monospace`;
        c.textAlign = 'center'; c.textBaseline = 'middle';
        for (let k = 0; k < ring.count; k++) {
          let ang = (k - v) * ring.gear;
          if (ring.wrap) ang = ((ang + 180) % 360 + 360) % 360 - 180;
          const a = ang * DEG - Math.PI / 2;
          const major = k % ring.label === 0, mid = ring.mid && k % ring.mid === 0;
          const tl = (r1 - r0) * (major ? 0.32 : mid ? 0.22 : 0.12);
          // fade ticks far from the reading window
          const fade = 0.35 + 0.65 * Math.pow(Math.cos(clamp(Math.abs(ang), 0, 180) * DEG / 2), 1.5);
          c.globalAlpha = fade;
          c.strokeStyle = tickCol; c.lineWidth = major ? 1.6 : 1;

          c.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
          c.lineTo(cx + Math.cos(a) * (r1 - tl), cy + Math.sin(a) * (r1 - tl));
          c.stroke();
          if (major) {
            const lr = r0 + (r1 - r0) * 0.36;
            c.fillStyle = tickCol;
            c.fillText(String(k), cx + Math.cos(a) * lr, cy + Math.sin(a) * lr);
          }
        }
        c.globalAlpha = 1;
      });
      // reading window at the top
      const half = 5 * DEG;
      c.fillStyle = 'rgba(111,227,245,0.12)';
      c.strokeStyle = 'rgba(111,227,245,0.75)'; c.lineWidth = 1.2;
      c.beginPath();
      c.arc(cx, cy, R * 0.995, -Math.PI / 2 - half, -Math.PI / 2 + half);
      c.arc(cx, cy, R * 0.37, -Math.PI / 2 + half * 2.4, -Math.PI / 2 - half * 2.4, true);
      c.closePath(); c.fill(); c.stroke();

      c.fillStyle = '#ecd08e'; c.strokeStyle = '#6e5525';
      c.beginPath(); c.moveTo(cx - 9, 1); c.lineTo(cx + 9, 1); c.lineTo(cx, 15); c.closePath(); c.fill(); c.stroke();
      // outer brass rim
      c.strokeStyle = '#c9a35a'; c.lineWidth = 3;
      c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.stroke();
      // hub with readout
      const hr = R * 0.35;
      const hub = c.createRadialGradient(cx, cy - hr * 0.3, hr * 0.1, cx, cy, hr);
      hub.addColorStop(0, '#1d2848'); hub.addColorStop(1, '#070b18');
      c.fillStyle = hub; c.beginPath(); c.arc(cx, cy, hr, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#c9a35a'; c.lineWidth = 2; c.stroke();
      c.fillStyle = d.enabled ? '#6fe3f5' : '#6b6e7d';
      c.shadowColor = 'rgba(111,227,245,0.7)'; c.shadowBlur = d.enabled ? 10 : 0;
      if (d.enabled) {
        c.font = `700 ${Math.round(S * 0.11)}px ui-monospace, Menlo, monospace`;
        c.fillText(`${d.parts[0]}°`, cx, cy - S * 0.03);
        c.font = `600 ${Math.round(S * 0.06)}px ui-monospace, Menlo, monospace`;
        c.fillText(`${String(d.parts[1]).padStart(2, '0')}′ ${String(d.parts[2]).padStart(2, '0')}″`, cx, cy + S * 0.075);
      } else {
        c.font = `700 ${Math.round(S * 0.11)}px ui-monospace, Menlo, monospace`;
        c.fillText('—', cx, cy);
      }
      c.shadowBlur = 0;
      // dim when disabled
      if (!d.enabled) {
        c.fillStyle = 'rgba(6,10,22,0.45)';
        c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();
      }
    }

    function local(e) {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left - r.width / 2, y: e.clientY - r.top - r.height / 2, R: r.width / 2 - 3 };
    }
    cv.addEventListener('pointerdown', e => {
      const p = local(e);
      const f = Math.hypot(p.x, p.y) / p.R;
      const ring = RINGS.findIndex(r => f >= r.band[0] - 0.02 && f <= r.band[1] + 0.03);

      if (!drag || e.pointerId !== drag.id) return;

      drag.acc += da;

      const n = Math.trunc(drag.acc / g);
      if (n) { drag.acc -= n * g; step(d.active, -n); }

    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);

    return {
      get value() { return d.parts[0] + d.parts[1] / 60 + d.parts[2] / 3600; },
      set(deg) {
        const { D, M, S } = dms(deg || 0);
        d.parts = [opts.degWrap ? D % 360 : D, M, S];
        constrain(); render();
      },
      get enabled() { return d.enabled; },
      setEnabled(on) { d.enabled = on; render(); },
      get active() { return d.active; },
      setActive(i) { d.active = i; render(); },
      nudge(n) { step(d.active, n); },
      fit
    };
  }

  // ---------- r bar ----------
  const R_MAX = 100;
  function createRBar(opts) {
    const bar = $('rbar'), fill = $('rfill'), thumb = $('rthumb');
    const st = { tenths: 0, enabled: false };
    $('rticks').innerHTML = Array.from({ length: 11 }, (_, i) => `<span style="left:${i * 10}%">${i * 10}</span>`).join('');
    function render() {
      const f = st.tenths / (R_MAX * 10);
      fill.style.width = (f * 100) + '%';
      thumb.style.left = (f * 100) + '%';
    }
    function setTenths(t, sound) {
      t = clamp(Math.round(t), 0, R_MAX * 10);
      if (t === st.tenths) return;
      st.tenths = t;
      if (sound) tick();
      render(); opts.onChange();
    }
    let drag = null;
    function fromEvent(e) {
      const r = bar.getBoundingClientRect();
      return clamp((e.clientX - r.left) / r.width, 0, 1) * R_MAX * 10;
    }
    bar.addEventListener('pointerdown', e => {
      if (!st.enabled && opts.onEnable) opts.onEnable();
      bar.setPointerCapture(e.pointerId);
      drag = e.pointerId;
      setTenths(fromEvent(e), true);
    });
    bar.addEventListener('pointermove', e => { if (drag === e.pointerId) setTenths(fromEvent(e), true); });
    const end = e => { if (drag === e.pointerId) drag = null; };
    bar.addEventListener('pointerup', end);
    bar.addEventListener('pointercancel', end);
    return {
      get value() { return st.tenths / 10; },
      set(v) { st.tenths = clamp(Math.round((v || 0) * 10), 0, R_MAX * 10); render(); },
      get enabled() { return st.enabled; },
      setEnabled(on) { st.enabled = on; },
      nudge(d) { setTenths(st.tenths + d * 10, true); }
    };
  }

  // ---------- UI ----------
  function $(id) { return document.getElementById(id); }
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const swatch = id => `<span class="swatch" style="background:${id === state.base ? '#d4af5f' : colorOf(id)}"></span>`;
  const relTo = id => cartToSph(sub(posOf(id), basePos()));
  function coordsInline(sph) { return `r ${fmtR(sph.r)} · θ ${fmtAngle(sph.th)} · φ ${fmtAngle(sph.ph, true)}`; }
  function obsInline(o) {
    let s = `θ ${fmtAngle(o.th)}`;
    if (o.ph != null) s += ` · φ ${fmtAngle(o.ph, true)}`;
    if (o.r != null) s += ` · r ${fmtR(o.r)}`;
    return s;
  }
  function partialSummary(id) {
    if (solved.noCross.has(id)) return 'feixes sem cruzamento';
    const own = state.obs.filter(o => o.target === id);
    if (!own.length) return '—';
    return own.map(o => `${byId(o.from).name}: ${obsInline(o)}`).join(' | ');
  }
  let toastTimer = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // Tabs
  let activeTab = 'universos';
  function showTab(name) {
    activeTab = name;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    $('tab-universos').hidden = name !== 'universos';
    $('tab-registro').hidden = name !== 'registro';
    if (name === 'registro') { dialTh.fit(); dialPh.fit(); }
  }
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

  function renderTiles() {
    const order = state.universes.slice().sort((a, b) => {
      const la = located(a.id), lb = located(b.id);
      if (la !== lb) return lb - la;
      if (la) return len(sub(posOf(a.id), basePos())) - len(sub(posOf(b.id), basePos()));
      return a.name.localeCompare(b.name);
    });
    $('tiles').innerHTML = order.map(u => {
      const loc = located(u.id);
      const isBase = u.id === state.base;
      const sub_ = isBase ? 'centro do mapa' : loc ? coordsInline(relTo(u.id)) : partialSummary(u.id);
      const color = isBase ? '#d4af5f' : colorOf(u.id);
      return `<li><button class="tile ${u.id === selectedId ? 'selected' : ''}" data-id="${esc(u.id)}">
        <span class="dot" style="background:${color};color:${color}"></span>
        <span class="nm">${esc(u.name)}</span>
        <span class="badges">${u.id === state.current ? '<span class="badge ship">nave</span>' : ''}${isBase ? '<span class="badge base">base</span>' : ''}</span>
        <span class="sub">${esc(sub_)}</span>
      </button></li>`;
    }).join('');
    $('tiles').querySelectorAll('.tile').forEach(b => b.onclick = () => select(b.dataset.id));
  }

  function renderSelection() {
    const el = $('selection');
    const u = selectedId ? byId(selectedId) : null;
    if (!u) { el.innerHTML = ''; return; }
    const isBase = u.id === state.base, isLoc = located(u.id);
    const related = state.obs.filter(o => o.target === u.id || o.from === u.id);
    let body;
    if (isBase) body = '<p class="empty">Centro do mapa.</p>';
    else if (isLoc) {
      const s = relTo(u.id);
      body = `<dl class="coords"><dt>r</dt><dd>${fmtR(s.r)}</dd><dt>θ</dt><dd>${fmtAngle(s.th)}</dd><dt>φ</dt><dd>${fmtAngle(s.ph, true)}</dd></dl>`;
    } else body = `<p class="empty">${solved.noCross.has(u.id) ? 'Feixes sem cruzamento.' : 'Posição desconhecida.'}</p>`;
    const obsHtml = related.length ? `<h3>Registros</h3><ul class="obs">${related.map(o => `<li>
        <button class="edit" data-edit="${esc(o.id)}"><span class="from">${esc(byId(o.target).name)} a partir de ${esc(byId(o.from).name)}</span><span class="val">${obsInline(o)}</span></button>
        <button class="del" data-del="${esc(o.id)}" title="Apagar registro">✕</button></li>`).join('')}</ul>` : '';
    el.innerHTML = `<div class="card">
      <div class="name">${swatch(u.id)}${esc(u.name)}</div>
      ${body}${obsHtml}
      <div class="row">
        ${isLoc && !isBase ? '<button id="btnBase">Usar como base</button>' : ''}
        <button id="btnRegister">Registrar coordenada</button>
        ${u.id === 'alther' || u.id === state.current ? '' : '<button class="danger" id="btnDelete">Remover</button>'}
      </div>
    </div>`;
    const bb = $('btnBase'); if (bb) bb.onclick = () => setBase(u.id);
    $('btnRegister').onclick = () => openRegister(u.id, state.base === u.id ? null : state.base);
    const d = $('btnDelete'); if (d) d.onclick = () => removeUniverse(u.id);
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeObs(b.dataset.del));
    el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      const o = state.obs.find(x => x.id === b.dataset.edit);
      if (o) openRegister(o.target, o.from);
    });
  }

  function renderHud() {
    $('shipName').textContent = byId(state.current).name;
    $('baseName').textContent = byId(state.base).name;
    const names = [...state.history, state.current].map(byId).filter(Boolean).map(u => u.name);
    $('route').textContent = names.length > 1 ? `Rota: ${names.join(' → ')}` : '';
    const ok = canJump(selectedId);
    $('btnJump').disabled = !ok;
    $('jumpDest').textContent = ok ? `para ${byId(selectedId).name}` : 'escolha um destino';
    $('jumpDock').hidden = !!travel;
    $('travelBanner').hidden = !travel;
    if (travel) $('travelRoute').textContent = `${byId(travel.from).name} → ${byId(travel.to).name}`;
    $('panel').classList.toggle('locked', !!travel);
  }

  function renderAll() {
    renderHud(); renderTiles(); renderSelection(); renderRegister(); requestDraw();
  }

  function select(id) {
    selectedId = id;
    renderHud(); renderTiles(); renderSelection(); requestDraw();
  }
  function setBase(id) {
    if (!located(id)) return;
    state.base = id;
    save(); retarget(true); renderAll();
  }

  function commit(animate = true) {
    const before = new Set(solved.pos.keys());
    solve();
    if (!located(state.base)) state.base = state.current;
    const found = [...solved.pos.keys()].filter(id => !before.has(id));
    if (found.length) {
      const t0 = performance.now() + (animate ? 300 : 0);
      found.forEach((id, i) => effects.push({ id, t0: t0 + i * 450, kind: 'found' }));
      setTimeout(playDiscovery, animate ? 300 : 0);
    }
    save(); retarget(animate); renderAll();
  }

  function guardedChange(mutate, msg) {
    const backup = JSON.stringify(state);
    mutate();
    solve();
    if (!located(state.current)) {
      state = JSON.parse(backup);
      solve();
      alert(msg);
      return false;
    }
    return true;
  }
  function removeObs(obsId) {
    if (!confirm('Apagar este registro?')) return;
    if (!guardedChange(() => { state.obs = state.obs.filter(o => o.id !== obsId); },
      'Este registro é o que localiza o universo onde a nave está. Ele não pode ser apagado.')) return;
    commit();
  }
  function removeUniverse(id) {
    const u = byId(id);
    if (!u || id === 'alther' || id === state.current) return;
    if (!confirm(`Remover ${u.name} e todos os registros ligados a ele?`)) return;
    if (!guardedChange(() => {
      state.universes = state.universes.filter(x => x.id !== id);
      state.obs = state.obs.filter(o => o.target !== id && o.from !== id);
      state.history = state.history.filter(h => h !== id);
    }, `Não é possível remover ${u.name}: a posição atual da nave depende dele.`)) return;
    selectedId = null;
    commit();
  }

  // ---------- Register tab ----------
  const NEW = '__new__';
  const reg = { target: null, from: 'alther' };
  const dialTh = createDial($('dialTh'), {
    degGear: 1.9, degCount: 181, degWrap: false, degLabel: 10, degMid: 5, maxTotal: 180,
    onChange: () => renderInstruments(), onActive: () => renderInstruments()
  });
  const dialPh = createDial($('dialPh'), {
    degGear: 1, degCount: 360, degWrap: true, degLabel: 30, degMid: 10,
    onChange: () => renderInstruments(), onActive: () => renderInstruments(),
    onEnable: () => { dialPh.setEnabled(true); renderInstruments(); }
  });
  const rBar = createRBar({
    onChange: () => renderInstruments(),
    onEnable: () => { rBar.setEnabled(true); if (!dialPh.enabled) dialPh.setEnabled(true); renderInstruments(); }
  });

  function loadPair() {
    const o = reg.target && reg.target !== NEW && reg.from ? findObs(reg.target, reg.from) : null;
    dialTh.set(o ? o.th : 0);
    dialPh.set(o && o.ph != null ? o.ph : 0);
    dialPh.setEnabled(!!(o && o.ph != null));
    rBar.set(o && o.r != null ? o.r : 0);
    rBar.setEnabled(!!(o && o.r != null));
    $('fError').textContent = '';
  }
  function openRegister(target, from) {
    reg.target = target;
    reg.from = from && from !== target ? from : (state.base !== target ? state.base : state.universes.find(u => u.id !== target).id);
    loadPair();
    renderRegister();
    showTab('registro');
  }

  function renderInstruments() {
    $('valTh').textContent = fmtAngle(dialTh.value);
    $('valPh').textContent = dialPh.enabled ? fmtAngle(dialPh.value, true) : '—';
    $('valR').textContent = rBar.enabled ? fmtR1(rBar.value) : '—';
    $('instPh').classList.toggle('off', !dialPh.enabled);
    $('instR').classList.toggle('off', !rBar.enabled);
    $('togPh').textContent = dialPh.enabled ? 'conhecido' : 'desconhecido';
    $('togPh').classList.toggle('on', dialPh.enabled);
    $('togR').textContent = rBar.enabled ? 'conhecido' : 'desconhecido';
    $('togR').classList.toggle('on', rBar.enabled);
    document.querySelectorAll('.seg').forEach(seg => {
      const dial = seg.dataset.dial === 'th' ? dialTh : dialPh;
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('active', +b.dataset.ring === dial.active));
    });
  }

  function renderRegister() {
    if (reg.target && reg.target !== NEW && !byId(reg.target)) reg.target = null;
    if (!byId(reg.from)) reg.from = state.base;
    const chip = (id, active, disabled, label) =>
      `<button class="chip ${active ? 'active' : ''}" data-id="${esc(id)}" ${disabled ? 'disabled' : ''}>${label}</button>`;
    $('chipsTarget').innerHTML = state.universes.map(u =>
      chip(u.id, reg.target === u.id, false, swatch(u.id) + esc(u.name))).join('') +
      `<button class="chip add ${reg.target === NEW ? 'active' : ''}" data-id="${NEW}">+ Novo</button>`;
    $('chipsFrom').innerHTML = state.universes.map(u =>
      chip(u.id, reg.from === u.id, u.id === reg.target, swatch(u.id) + esc(u.name))).join('');
    $('newName').hidden = reg.target !== NEW;
    const existing = reg.target && reg.target !== NEW && findObs(reg.target, reg.from);
    $('btnSave').textContent = existing ? 'Atualizar registro' : 'Registrar';
    $('chipsTarget').querySelectorAll('.chip').forEach(b => b.onclick = () => {
      reg.target = b.dataset.id;
      if (reg.from === reg.target) reg.from = state.universes.find(u => u.id !== reg.target).id;
      loadPair(); renderRegister();
      if (reg.target === NEW) $('newName').focus();
    });
    $('chipsFrom').querySelectorAll('.chip').forEach(b => b.onclick = () => {
      reg.from = b.dataset.id;
      loadPair(); renderRegister();
    });
    renderInstruments();
  }

  // dial nudge + ring selectors
  function holdRepeat(btn, fn) {
    let timer = null, interval = null;
    const stop = () => { clearTimeout(timer); clearInterval(interval); timer = interval = null; };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      fn();
      timer = setTimeout(() => { interval = setInterval(fn, 70); }, 380);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  }
  document.querySelectorAll('.nudge .step').forEach(b => {
    const dial = b.dataset.dial === 'th' ? dialTh : dialPh;
    holdRepeat(b, () => {
      if (!dial.enabled) { dial.setEnabled(true); }
      dial.nudge(+b.dataset.dir);
      renderInstruments();
    });
  });
  document.querySelectorAll('.seg').forEach(seg => {
    const dial = seg.dataset.dial === 'th' ? dialTh : dialPh;
    seg.querySelectorAll('button').forEach(b => b.onclick = () => { dial.setActive(+b.dataset.ring); renderInstruments(); });
  });
  document.querySelectorAll('.rsteps button').forEach(b => holdRepeat(b, () => {
    if (!rBar.enabled) { rBar.setEnabled(true); if (!dialPh.enabled) dialPh.setEnabled(true); }
    rBar.nudge(+b.dataset.r);
    renderInstruments();
  }));
  $('togPh').onclick = () => {
    const on = !dialPh.enabled;
    dialPh.setEnabled(on);
    if (!on) rBar.setEnabled(false);
    renderInstruments();
  };
  $('togR').onclick = () => {
    const on = !rBar.enabled;
    rBar.setEnabled(on);
    if (on && !dialPh.enabled) dialPh.setEnabled(true);
    renderInstruments();
  };

  $('btnSave').onclick = () => {
    const err = $('fError');
    let target = reg.target;
    if (!target) return err.textContent = 'Escolha o universo.';
    if (target === NEW) {
      const name = $('newName').value.trim();
      if (!name) return err.textContent = 'Dê um nome ao universo.';
      if (state.universes.some(u => u.name.toLowerCase() === name.toLowerCase())) return err.textContent = 'Já existe um universo com esse nome.';
      const u = { id: newId('u'), name };
      state.universes.push(u);
      target = u.id;
    }
    if (target === reg.from) return err.textContent = 'Um universo não pode ser medido a partir dele mesmo.';
    const th = dialTh.value;
    const ph = dialPh.enabled ? dialPh.value : null;
    const r = rBar.enabled ? rBar.value : null;
    if (r != null && r <= 0) return err.textContent = 'r inválido.';
    const existing = findObs(target, reg.from);
    if (existing) Object.assign(existing, { th, ph, r });
    else state.obs.push({ id: newId('o'), target, from: reg.from, th, ph, r });
    err.textContent = '';
    $('newName').value = '';
    reg.target = target;
    selectedId = target;
    toast(existing ? 'Registro atualizado' : 'Registro salvo');
    commit();
  };

  // ---------- HUD buttons ----------
  function renderSound() { $('btnSound').textContent = muted ? '🔇' : '🔊'; }
  $('btnSound').onclick = () => {
    muted = !muted;
    if (muted) stopDrone(); else if (travel) startDrone();
    try { localStorage.setItem(SOUND_KEY, muted ? 'off' : 'on'); } catch (e) { /* ignore */ }
    renderSound();
  };
  renderSound();
  $('btnRecenter').onclick = () => { view.yaw = -0.6; view.pitch = 0.42; view.zoom = 1; requestDraw(); };
  $('btnJump').onclick = startJump;

  $('btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mapa-navegacao.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('btnImport').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const s = JSON.parse(await f.text());
      if (!validState(s)) throw new Error('invalid');
      if (!confirm('Substituir o mapa atual pelo arquivo importado?')) return;
      state = normalize(s); selectedId = null;
      solve();
      if (!located(state.current)) { state.current = 'alther'; state.history = []; }
      commit(false);
    } catch (err) {
      alert('Arquivo inválido.');
    }
  };
  $('btnReset').onclick = () => {
    if (!confirm('Apagar todos os universos registrados e voltar para Alther?')) return;
    state = defaultState(); selectedId = null; reg.target = null; reg.from = 'alther';
    loadPair(); commit();
  };

  // ---------- Boot ----------
  window.addEventListener('resize', resize);
  solve();
  if (!located(state.current)) { state.current = 'alther'; state.history = []; }
  if (!located(state.base)) state.base = state.current;
  reg.from = state.base;
  resize();
  retarget(false);
  loadPair();
  renderAll();
})();
</script>
</body>
</html>
