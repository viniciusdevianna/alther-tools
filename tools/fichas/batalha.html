<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Batalha · Fichas e Decks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  main { max-width: 1100px; }
  .rodada { font-family: var(--display); color: var(--brass); font-size: 14px; letter-spacing: 0.08em; white-space: nowrap; }

  /* Pilhas */
  .mesa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .pilha {
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0;
  }
  .pilha h2 { margin: 0; font-family: var(--display); font-size: 13px; letter-spacing: 0.14em; color: var(--brass); text-transform: uppercase; }
  .pilha .botoes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .monte {
    position: relative; width: 74px; height: 100px; border-radius: 9px; cursor: pointer; border: 1px solid var(--brass-lo);
    display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 24px; color: var(--brass-hi);
    background: var(--field); padding: 0;
  }
  .monte.verso {
    background:
      radial-gradient(circle at 50% 50%, rgba(111,227,245,0.35) 0 9px, transparent 10px),
      radial-gradient(circle at 50% 50%, transparent 0 20px, rgba(201,163,90,0.5) 21px 22px, transparent 23px),
      repeating-linear-gradient(45deg, rgba(201,163,90,0.12) 0 6px, transparent 6px 12px),
      linear-gradient(180deg, #1a1530, #0d1428);
    box-shadow: 3px 3px 0 -1px #0d1428, 3px 3px 0 0 var(--brass-lo), 6px 6px 0 -1px #0d1428, 6px 6px 0 0 var(--brass-lo);
  }
  .monte.verso span { background: rgba(7,11,22,0.8); padding: 0 8px; border-radius: 8px; }
  .monte.vazio { box-shadow: none; background: transparent; border-style: dashed; color: var(--muted); font-size: 18px; }
  .monte.topo { border-width: 2px; border-color: var(--atr); background: linear-gradient(180deg, var(--atr-suave), var(--field)); font-size: 11px; font-family: system-ui, sans-serif; color: var(--text); padding: 6px; line-height: 1.2; flex-direction: column; gap: 6px; }
  .monte.topo b { font-family: var(--display); font-size: 18px; color: var(--brass-hi); }
  .contagem-pilha { font-size: 13px; color: var(--muted); }
  .recargas b { font-family: var(--display); font-size: 26px; color: var(--brass-hi); }

  .turno { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .btn.grande { min-height: 52px; padding: 10px 24px; font-family: var(--display); font-size: 17px; letter-spacing: 0.06em; }
  .btn.desfazer { margin-left: auto; }

  /* Zonas */
  .zona { margin-bottom: 18px; }
  .zona > h2 { font-family: var(--display); font-size: 14px; letter-spacing: 0.14em; color: var(--brass); text-transform: uppercase; margin: 0 0 8px; }
  .zona > h2 small { font-family: system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .fileira { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 10px; }
  .zona-vazia { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); font-size: 14px; }

  .mini {
    position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; padding: 14px 11px 11px; text-align: left; cursor: pointer;
    border-radius: 11px; border: 1px solid rgba(110,85,37,0.7); color: var(--text); font: inherit; min-height: 170px;
    background: linear-gradient(180deg, var(--atr-suave), transparent 70px), linear-gradient(180deg, var(--panel-2), var(--panel));
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .mini::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--atr); }
  .mini:hover, .mini:focus-visible { border-color: var(--atr); transform: translateY(-2px); outline: none; }
  .mini h3 { margin: 0; font-family: var(--display); font-size: 14.5px; line-height: 1.2; }
  .mini h3::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--atr); vertical-align: 1px; }
  .mini .sub { font-size: 11px; color: var(--muted); }
  .mini .nums { display: flex; flex-wrap: wrap; gap: 4px; font-size: 11.5px; }
  .mini .nums span { background: var(--field); padding: 1px 6px; border-radius: 5px; }
  .mini .nums b { color: var(--brass-hi); }
  .mini p { margin: 0; font-size: 12.5px; color: #cfd0d8; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  #campo .mini { min-height: 130px; }
  #campo .mini p { -webkit-line-clamp: 3; }

  /* Janela (detalhe da carta e listas) */
  dialog {
    width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); padding: 0; border-radius: 16px;
    background: var(--bg); color: var(--text); border: 1px solid var(--brass-lo); box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  dialog::backdrop { background: rgba(3, 5, 12, 0.72); backdrop-filter: blur(2px); }
  .janela-topo { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: rgba(7,11,22,0.96); border-bottom: 1px solid var(--line); }
  .janela-topo h2 { flex: 1; margin: 0; font-family: var(--display); font-size: 16px; color: var(--brass-hi); letter-spacing: 0.05em; }
  .janela-corpo { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .janela-corpo .carta { gap: 8px; }
  .acoes-carta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .acoes-carta .btn { min-height: 46px; }
  .aviso-janela { font-size: 13px; color: var(--warn); margin: 0; }
  .lista-cartas { display: flex; flex-direction: column; gap: 6px; }
  .item-lista {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left;
    background: var(--panel); border: 1px solid rgba(201,163,90,0.18); border-left: 4px solid var(--atr); color: var(--text); font: inherit;
  }
  .item-lista:hover { border-color: var(--atr); }
  .item-lista .nome { flex: 1; min-width: 0; }
  .item-lista small { color: var(--muted); font-size: 12px; }
  .item-lista .pos { font-size: 11px; color: var(--muted); min-width: 34px; }

  .historico summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .historico ol { margin: 8px 0 0; padding-left: 22px; font-size: 13px; color: #c7c8d2; max-height: 260px; overflow: auto; }
  .fim { margin-top: 24px; display: flex; justify-content: flex-end; }

  .inicio { max-width: 560px; margin: 40px auto; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .inicio h2 { font-family: var(--display); color: var(--brass-hi); margin: 0; }
  .inicio ul { text-align: left; color: var(--warn); font-size: 14px; margin: 0; }

  .aviso-flutuante {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); z-index: 50;
    padding: 10px 16px; border-radius: 10px; background: #1b2238; border: 1px solid var(--brass); color: var(--text); font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: calc(100vw - 32px); text-align: center;
  }
  .aviso-flutuante.mostrar { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .mesa { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .btn.grande { flex: 1; }
    .btn.desfazer { margin-left: 0; }
    .fileira { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div class="topo">
  <div class="topo-linha">
    <a class="voltar" id="voltar" href="./">← Ficha</a>
    <h1 id="titulo">Batalha</h1>
    <span class="rodada" id="rodada"></span>
  </div>
</div>
<main id="app"></main>
<dialog id="janela"></dialog>
<div class="aviso-flutuante" id="aviso" role="status" aria-live="polite"></div>

<script src="cartas.js"></script>
<script src="comum.js"></script>
<script src="batalha.js"></script>
</body>
</html>
